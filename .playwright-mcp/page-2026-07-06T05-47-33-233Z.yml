      - generic [ref=f168e113]:
        - generic [ref=f168e115]:
          - generic [ref=f168e116]: Why Fracktal
          - heading "An Original Equipment Manufacturer, Not a Reseller" [level=2] [ref=f168e118]
          - paragraph [ref=f168e120]: Most “manufacturers” in this market import and rebadge machines. Fracktal designs, builds, and tests every printer at its own facility.
        - generic [ref=f168e122]:
          - generic [ref=f168e123]:
            - generic [ref=f168e124]: "01"
            - heading "Built from the Ground Up" [level=3] [ref=f168e126]
            - paragraph [ref=f168e128]: Motion systems, firmware, and electronics are developed in-house — not sourced from a generic reference design and relabeled.
          - generic [ref=f168e129]:
            - generic [ref=f168e130]: "02"
            - heading "Make in India, Verified" [level=3] [ref=f168e132]
            - paragraph [ref=f168e134]: Design, assembly, and calibration happen at our own facility in Bangalore — not outsourced, not imported as a kit.
          - generic [ref=f168e135]:
            - generic [ref=f168e136]: "03"
            - heading "Direct Engineering Support" [level=3] [ref=f168e138]
            - paragraph [ref=f168e140]: Because we build the machine, our engineering team can support it — no reseller layer between you and the people who designed it.
      - generic [ref=f168e144]:
        - generic [ref=f168e145]: Since 2013
        - heading "Founded by Engineers, for Engineers" [level=2] [ref=f168e147]
        - generic [ref=f168e148]:
          - paragraph [ref=f168e149]: Fracktal Works was founded in 2013 by Rohit Asil and Vijay Raghav Varada, engineering students at the Manipal Institute of Technology working with the Robomanipal robotics team. Building their own robots meant they needed 3D printers they could actually afford — so they built their own.
          - paragraph [ref=f168e150]: That printer became a company. Over a decade later, Fracktal designs and manufactures every machine itself, from compact desktop systems to large-format industrial printers.
        - link "Read Our Full Story" [ref=f168e152] [cursor=pointer]:
          - /url: https://fracktal.in/home/about-us/
          - generic [ref=f168e154]: Read Our Full Story

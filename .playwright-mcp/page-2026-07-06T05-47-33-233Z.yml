        - generic [ref=f168e89]: Original Equipment Manufacturer · Bangalore, India
        - heading "India's Premier 3D Printer Manufacturer" [level=1] [ref=f168e91]
        - paragraph [ref=f168e93]: Fracktal Works designs, engineers, and manufactures 3D printers in Bangalore, India — from desktop precision machines to production-grade industrial systems. Every printer is built in-house, from the ground up. No imported kits. No rebadging.

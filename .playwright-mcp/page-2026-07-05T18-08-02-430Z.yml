        - heading "Get the code right before the purchase order goes out" [level=2] [ref=f128e20]
        - paragraph [ref=f128e21]: HSN and SAC codes determine the GST you pay, the input tax credit you can claim, and whether your invoices and import documents clear without dispute. For 3D printing, the correct code depends on exactly what is being supplied — a machine, a consumable, or a service. Below is how Fracktal Works classifies each, based on the relevant tariff headings.

    - generic [ref=f128e123]:
      - generic [ref=f128e124]:
        - paragraph [ref=f128e125]: Frequently asked
        - heading "Common HSN & GST questions on 3D printing" [level=2] [ref=f128e126]
      - generic [ref=f128e127]:
        - heading "What is the HSN code for 3D printed parts?" [level=3] [ref=f128e128]
        - paragraph [ref=f128e129]:
          - text: It depends on how the parts are supplied. When you commission Fracktal Works to print parts on demand, that is a manufacturing
          - emphasis [ref=f128e130]: service
          - text: and is classified under SAC 998920 at 18% GST — not a goods HSN. The finished part itself, if sold as a traded good, would take the HSN of the article it represents. For most procurement of custom FDM parts, the 998920 service code applies.
      - generic [ref=f128e131]:
        - heading "What is the GST rate on 3D printed products?" [level=3] [ref=f128e132]
        - paragraph [ref=f128e133]: "The core 3D printing supplies attract 18% GST — this covers 3D printers (HSN 8443), printing services (SAC 998920), and filament (HSN 3916). One notable exception: nozzles and print-heads sold separately fall under a classification within heading 8443 that attracts 28% GST. Always match the rate to what is actually being invoiced."
      - generic [ref=f128e134]:
        - heading "Is there a separate HSN code for 3D printing services vs. 3D printer filament?" [level=3] [ref=f128e135]
        - paragraph [ref=f128e136]:
          - text: Yes. They are fundamentally different supplies. 3D printing
          - emphasis [ref=f128e137]: services
          - text: use SAC 998920 (a services code for moulding, pressing, extruding and similar plastic manufacturing services). 3D printer
          - emphasis [ref=f128e138]: filament
          - text: is a physical good and uses HSN 3916 (plastic monofilament and profile shapes with cross-section greater than 1 mm). Both are taxed at 18%, but the codes are distinct and must be used correctly on the invoice.
    - generic [ref=f128e140]:
      - heading "Buying 3D printers or sourcing printed parts?" [level=2] [ref=f128e142]
      - paragraph [ref=f128e143]: Fracktal Works designs and builds 3D printers in-house in Bangalore and runs a production 3D printing service. If you need the right classification for a purchase order, a bulk filament supply, or an on-demand manufacturing quote, our team can help you get the paperwork and the parts right.
      - generic [ref=f128e144]:
        - link "Explore 3D printing services" [ref=f128e145] [cursor=pointer]:
          - /url: https://www.fracktal.in/3d-printing-services/
        - link "Talk to our team" [ref=f128e146] [cursor=pointer]:
          - /url: https://www.fracktal.in/contact-us/
    - paragraph [ref=f128e147]: This page is a general reference for HSN/SAC classification and GST rates on 3D printing in India. It is not tax advice. Confirm current rates with your tax advisor or the GST portal.

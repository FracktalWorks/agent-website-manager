          - heading "Import & purchase decisions" [level=3] [ref=f128e26]
          - paragraph [ref=f128e27]: Machinery, consumables, and spares sit under different tariff headings. The heading sets the GST and any applicable customs duty on landed cost.
        - generic [ref=f128e29]:
          - generic [ref=f128e30]: "02"
          - heading "Invoicing & compliance" [level=3] [ref=f128e31]
          - paragraph [ref=f128e32]: A wrong HSN or SAC on a tax invoice creates reconciliation issues in GSTR filings and can delay payment from your customers.
        - generic [ref=f128e34]:
          - generic [ref=f128e35]: "03"
          - heading "Input tax credit" [level=3] [ref=f128e36]
          - paragraph [ref=f128e37]: Correctly booked GST on equipment and services flows into eligible input tax credit — misclassification risks a reversal on audit.

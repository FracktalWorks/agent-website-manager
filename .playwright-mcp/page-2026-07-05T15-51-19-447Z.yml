      - generic [ref=f32e105]:
        - heading "Carbon Fiber Nylon for FDM 3D Printing" [level=2] [ref=f32e107]
        - heading "Carbon Fiber Nylon is a composite filament made by infusing chopped carbon fibers into a nylon (polyamide) base." [level=6] [ref=f32e109]
        - generic [ref=f32e110]:
          - paragraph [ref=f32e111]: This combination results in a material that is incredibly strong, lightweight, and highly resistant to wear and impact. It also has excellent chemical resistance and can withstand demanding mechanical stress.
          - paragraph [ref=f32e112]: The carbon fibers add stiffness and dimensional stability, while the nylon base contributes flexibility and durability, making it ideal for high-performance and engineering-grade applications.
    - generic [ref=f32e114]:
      - img [ref=f32e116]

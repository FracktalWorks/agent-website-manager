    - generic [ref=f15e310]:
      - generic [ref=f15e311]: Decision Guide
      - heading "When to Use CF-PA — and When Not To" [level=2] [ref=f15e312]
    - generic [ref=f15e313]:
      - generic [ref=f15e314]:
        - generic [ref=f15e315]:
          - img [ref=f15e316]
          - heading "Use CF-PA when" [level=3] [ref=f15e318]
        - list [ref=f15e320]:
          - listitem [ref=f15e321]:
            - img [ref=f15e323]
            - text: Part operates above 80 °C continuously.
          - listitem [ref=f15e325]:
            - img [ref=f15e327]
            - text: High stiffness-to-weight ratio is required (e.g. EOAT, structural brackets).
          - listitem [ref=f15e329]:
            - img [ref=f15e331]
            - text: Dimensional stability over temperature cycles is critical.
          - listitem [ref=f15e333]:
            - img [ref=f15e335]
            - text: Part will be machined or drilled after printing.
          - listitem [ref=f15e337]:
            - img [ref=f15e339]
            - text: You need to replace metal in low-to-medium load applications.
      - generic [ref=f15e341]:
        - generic [ref=f15e342]:
          - img [ref=f15e343]
          - heading "Avoid CF-PA when" [level=3] [ref=f15e345]
        - list [ref=f15e347]:
          - listitem [ref=f15e348]:
            - img [ref=f15e350]
            - text: Part requires high impact / ductile failure — use unfilled Nylon or TPU instead.
          - listitem [ref=f15e352]:
            - img [ref=f15e354]
            - text: Surface aesthetics are primary — CF-PA has a matte, slightly rough finish.
          - listitem [ref=f15e356]:
            - img [ref=f15e358]
            - text: Your machine lacks an all-metal hot-end.
          - listitem [ref=f15e360]:
            - img [ref=f15e362]
            - text: Part contacts food, drinking water, or medical fluids (not certified).
          - listitem [ref=f15e364]:
            - img [ref=f15e366]
            - text: You need tight tolerances without post-machining (moisture variability ±0.3 %).
  - generic [ref=f15e369]:
    - generic [ref=f15e370]:
      - generic [ref=f15e371]: Design for Additive
      - heading "DfAM Tips for CF-PA" [level=2] [ref=f15e372]
      - paragraph [ref=f15e373]: Design rules that turn a printable part into a structural one.
    - generic [ref=f15e374]:
      - generic [ref=f15e375]:
        - img [ref=f15e377]
        - heading "Wall thickness ≥ 1.5 mm" [level=3] [ref=f15e380]
        - paragraph [ref=f15e381]: CF fibre reinforcement needs a minimum of 3 perimeters to align correctly. Thinner walls print but lose their structural benefit.
      - generic [ref=f15e382]:
        - img [ref=f15e384]
        - heading "Fibre orientation = load path" [level=3] [ref=f15e386]
        - paragraph [ref=f15e387]: Route perimeters parallel to the primary stress axis. Avoid horizontal slicing through critical cross-sections.
      - generic [ref=f15e388]:
        - img [ref=f15e390]
        - heading "Avoid sharp internal corners" [level=3] [ref=f15e393]
        - paragraph [ref=f15e394]: Stress concentrations amplify at 90° interior corners in stiff composites. Use fillets of ≥1 mm radius.
      - generic [ref=f15e395]:
        - img [ref=f15e397]
        - heading "Post-anneal for best results" [level=3] [ref=f15e400]
        - paragraph [ref=f15e401]: 90 minutes at 80 °C in an oven reduces residual stress by ~40%. It also improves interlayer bond strength.

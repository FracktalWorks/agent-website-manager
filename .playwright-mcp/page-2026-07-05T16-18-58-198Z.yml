  - main [ref=f80e81]:
    - heading "HSN Code & GST on 3D Printing in India" [level=1] [ref=f80e83]
    - generic [ref=f80e85]:
      - generic [ref=f80e89]:
        - generic [ref=f80e91]: Tax & Classification Reference
        - heading "HSN Code & GST on 3D Printing in India" [level=1] [ref=f80e93]
        - paragraph [ref=f80e95]: Accurate HSN and SAC classifications and GST rates for 3D printers, filament, and printing services — so procurement and finance teams can invoice, import, and claim input tax credit with confidence.
        - generic [ref=f80e96]:
          - generic [ref=f80e98]: 3D Printers · HSN 8443 · 18%
          - generic [ref=f80e100]: Printing Services · SAC 998920 · 18%
          - generic [ref=f80e102]: Filament · HSN 3916 · 18%
      - generic [ref=f80e106]:
        - generic [ref=f80e108]: Why classification matters
        - heading "Get the code right before the purchase order goes out" [level=2] [ref=f80e110]
        - paragraph [ref=f80e112]: HSN and SAC codes determine the GST you pay, the input tax credit you can claim, and whether your invoices and import documents clear without dispute. For 3D printing, the correct code depends on exactly what is being supplied — a machine, a consumable, or a service. Below is how Fracktal Works classifies each, based on the relevant tariff headings.
        - generic [ref=f80e113]:
          - generic [ref=f80e115]:
            - generic [ref=f80e117]: "01"
            - heading "Import & purchase decisions" [level=3] [ref=f80e119]
            - paragraph [ref=f80e121]: Machinery, consumables, and spares sit under different tariff headings. The heading sets the GST and any applicable customs duty on landed cost.
          - generic [ref=f80e123]:
            - generic [ref=f80e125]: "02"
            - heading "Invoicing & compliance" [level=3] [ref=f80e127]
            - paragraph [ref=f80e129]: A wrong HSN or SAC on a tax invoice creates reconciliation issues in GSTR filings and can delay payment from your customers.
          - generic [ref=f80e131]:
            - generic [ref=f80e133]: "03"
            - heading "Input tax credit" [level=3] [ref=f80e135]
            - paragraph [ref=f80e137]: Correctly booked GST on equipment and services flows into eligible input tax credit — misclassification risks a reversal on audit.
      - generic [ref=f80e139]:
        - generic [ref=f80e141]: What’s being classified
        - heading "Three supplies, three different codes" [level=2] [ref=f80e143]
        - generic [ref=f80e144]:
          - generic [ref=f80e146]:
            - generic [ref=f80e149]: HSN 8443 · 18%
            - heading "3D Printers" [level=3] [ref=f80e151]
            - paragraph [ref=f80e153]: Complete FDM/SLS printing machines, classified as printing machinery under heading 8443.
          - generic [ref=f80e155]:
            - generic [ref=f80e158]: HSN 3916 · 18%
            - heading "Filament" [level=3] [ref=f80e160]
            - paragraph [ref=f80e162]: Plastic monofilament and profile shapes with cross-section over 1 mm — spooled FDM filament.
          - generic [ref=f80e164]:
            - generic [ref=f80e166]: SAC 998920 · 18%
            - heading "Printing Services" [level=3] [ref=f80e168]
            - paragraph [ref=f80e170]: On-demand FDM manufacturing and job-work, classified as a plastic manufacturing service.
      - generic [ref=f80e172]:
        - generic [ref=f80e174]: Reference table
        - heading "HSN / SAC codes and GST rates" [level=2] [ref=f80e176]
        - paragraph [ref=f80e178]: Classifications applied by Fracktal Works across 3D printing machinery, consumables, and services in India.
        - generic [ref=f80e179]:
          - generic [ref=f80e181]: Please verify
          - generic [ref=f80e182]:
            - text: GST and HSN classification can be nuanced and is subject to periodic notification changes. These codes reflect Fracktal Works’ classification for its own products and services, but the correct treatment for a specific transaction can depend on end-use, bundling, and place of supply. Confirm current rates with your tax advisor or the official GST portal before filing.
            - text: Updated as of 5 July 2026 · Verified against Fracktal Works’ published classifications.
      - generic [ref=f80e184]:
        - generic [ref=f80e186]: Frequently asked
        - heading "Common HSN & GST questions on 3D printing" [level=2] [ref=f80e188]
        - heading "What is the HSN code for 3D printed parts?" [level=3] [ref=f80e190]
        - paragraph [ref=f80e192]:
          - text: It depends on how the parts are supplied. When you commission Fracktal Works to print parts on demand, that is a manufacturing
          - emphasis [ref=f80e193]: service
          - text: and is classified under
          - strong [ref=f80e195]: SAC 998920
          - text: at
          - strong [ref=f80e197]: 18% GST
          - text: — not a goods HSN. The finished part itself, if sold as a traded good, would take the HSN of the article it represents. For most procurement of custom FDM parts, the 998920 service code applies.
        - heading "What is the GST rate on 3D printed products?" [level=3] [ref=f80e199]
        - paragraph [ref=f80e201]:
          - text: The core 3D printing supplies attract
          - strong [ref=f80e203]: 18% GST
          - text: "— this covers 3D printers (HSN 8443), printing services (SAC 998920), and filament (HSN 3916). One notable exception: nozzles and print-heads sold separately fall under a classification within heading 8443 that attracts"
          - strong [ref=f80e205]: 28% GST
          - text: . Always match the rate to what is actually being invoiced.
        - heading "Is there a separate HSN code for 3D printing services vs. 3D printer filament?" [level=3] [ref=f80e207]
        - paragraph [ref=f80e209]:
          - text: Yes. They are fundamentally different supplies. 3D printing
          - emphasis [ref=f80e210]: services
          - text: use
          - strong [ref=f80e212]: SAC 998920
          - text: (a services code for moulding, pressing, extruding and similar plastic manufacturing services). 3D printer
          - emphasis [ref=f80e213]: filament
          - text: is a physical good and uses
          - strong [ref=f80e215]: HSN 3916
          - text: (plastic monofilament and profile shapes with cross-section greater than 1 mm). Both are taxed at 18%, but the codes are distinct and must be used correctly on the invoice.
      - generic [ref=f80e217]:
        - heading "Buying 3D printers or sourcing printed parts?" [level=2] [ref=f80e219]
        - paragraph [ref=f80e221]: Fracktal Works designs and builds 3D printers in-house in Bangalore and runs a production 3D printing service. If you need the right classification for a purchase order, a bulk filament supply, or an on-demand manufacturing quote, our team can help you get the paperwork and the parts right.
        - generic [ref=f80e222]:
          - link "Explore 3D printing services" [ref=f80e224] [cursor=pointer]:

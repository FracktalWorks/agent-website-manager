<!-- @dsCard group="Spacing" -->
<title>Radius &amp; elevation</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin:0; padding:40px 34px 60px; background:var(--ground); }
.sheet { max-width:1000px; margin:0 auto; }
.sheet > header { margin-bottom:30px; }
.sheet h1 { font-size:34px; }
.sheet header p { margin-top:8px; }
.grid { display:grid; gap:14px; margin-top:22px; }
.sw { border:1px solid var(--line); border-radius:var(--r-sm); overflow:hidden;
      background:var(--paper); }
.sw .chip { height:92px; }
.sw .meta { padding:11px 14px; display:flex; flex-direction:column; gap:2px; }
.sw .meta b { font:600 13.5px/1.3 var(--body); color:var(--ink); }
.sw .meta code { font:500 12px/1.4 var(--mono); color:var(--ink-3); }
.sw .meta span { font:400 12px/1.45 var(--body); color:var(--ink-3); }
.note { margin-top:26px; padding:16px 20px; background:var(--paper);
        border:1px solid var(--line); border-left:3px solid var(--navy);
        border-radius:0 var(--r-sm) var(--r-sm) 0; }
.note p { font-size:14.5px; max-width:80ch; }
h2.sec { font-size:19px; margin:38px 0 4px; }
h3.sub { font-size:15.5px; margin:26px 0 2px; font-family:var(--body);
         font-weight:700; letter-spacing:0; }
.tablewrap { overflow-x:auto; margin-top:20px; }
table { border-collapse:collapse; width:100%; font-size:14.5px; min-width:520px; }
th { text-align:left; font:600 11px/1.3 var(--body); letter-spacing:.1em;
     text-transform:uppercase; color:var(--ink-2);
     border-bottom:2px solid var(--ink); padding:0 14px 9px 0; vertical-align:bottom; }
td { border-bottom:1px solid var(--line); padding:10px 14px 10px 0;
     vertical-align:top; }
td:last-child, th:last-child { padding-right:0; }
.num { font-variant-numeric:tabular-nums; white-space:nowrap; }
.stage { display:flex; align-items:center; justify-content:center; padding:26px; }
.stage img { width:100%; height:auto; display:block; }
.yes b, .no b { font:600 11px/1 var(--body); letter-spacing:.1em;
                text-transform:uppercase; }
.yes b { color:var(--mint-dp); }
.no b { color:#9A5320; }
</style>
<div class="sheet">
<header>
  <div class="eyebrow">Geometry</div>
  <h1>Radius &amp; elevation</h1>
  <p>Three radii and a single shadow.</p>
</header>
<div style="display:flex;gap:26px;flex-wrap:wrap;margin-top:20px"><div style="text-align:center"><div style="width:112px;height:84px;background:var(--mint-sf);border:1px solid var(--line);border-radius:26px"></div><div class="eyebrow" style="margin-top:10px">Card 26px</div></div><div style="text-align:center"><div style="width:112px;height:84px;background:var(--mint-sf);border:1px solid var(--line);border-radius:14px"></div><div class="eyebrow" style="margin-top:10px">Small 14px</div></div><div style="text-align:center"><div style="width:112px;height:84px;background:var(--mint-sf);border:1px solid var(--line);border-radius:999px"></div><div class="eyebrow" style="margin-top:10px">Pill</div></div></div><h2 class="sec">Elevation</h2><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr))"><div class="card"><b style="font:600 14px var(--body)">Hairline</b><p style="margin-top:6px;font-size:13.5px">The default. Border, no shadow.</p></div><div class="card lifted"><b style="font:600 14px var(--body)">Lifted</b><p style="margin-top:6px;font-size:13.5px">One shadow token, used sparingly.</p></div></div><div class="note"><p>There is exactly one shadow. Depth comes from the band rhythm, not from stacking elevations.</p></div>
</div>
